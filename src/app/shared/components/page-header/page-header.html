<nz-breadcrumb class="mb-1">
  <nz-breadcrumb-item>Trang chủ</nz-breadcrumb-item>
  <nz-breadcrumb-item>{{ title() }}</nz-breadcrumb-item>
  @if (current(); as current) {
    <nz-breadcrumb-item>{{ current }}</nz-breadcrumb-item>
  }
</nz-breadcrumb>
<div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
  <h1 class="m-0 text-xl font-semibold text-slate-900">{{ title() }}</h1>
  <!-- Các nút thao tác của trang, canh phải cùng hàng với tiêu đề -->
  <div class="flex flex-wrap items-center gap-2 empty:hidden">
    <ng-content />
  </div>
</div>
@if (subtitle()) {
  <p class="m-0 mt-1 text-sm text-slate-600">{{ subtitle() }}</p>
}
