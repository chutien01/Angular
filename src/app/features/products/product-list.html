<app-crud-page
  title="Sản phẩm"
  subtitle="Theo dõi danh mục, giá bán và tồn kho"
  entityName="sản phẩm"
  formMode="inline_form"
  [service]="service"
  [columns]="columns"
  [filters]="filters"
  [fields]="fields"
  [pageActions]="pageActions"
>
  <!-- Field custom "category": gợi ý danh mục có sẵn nhưng vẫn cho nhập danh mục mới.
       Vị trí, nhãn, span và validate lấy từ khai báo trong mảng fields của product-list.ts. -->
  <ng-template appCrudField="category" let-control let-id="id">
    <input
      nz-input
      placeholder="Chọn hoặc nhập danh mục"
      [id]="id"
      [formControl]="control"
      [nzAutocomplete]="categoryAuto"
    />
    <nz-autocomplete #categoryAuto>
      @for (category of categorySuggestions(control.value); track category) {
        <nz-auto-option [nzValue]="category" [nzLabel]="category">{{ category }}</nz-auto-option>
      }
    </nz-autocomplete>
  </ng-template>
</app-crud-page>
